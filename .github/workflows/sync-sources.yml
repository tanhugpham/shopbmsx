name: sync-sources

# Lịch chạy chỉ đọc. Không bật mua hàng và không tắt DRY_RUN.
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements.txt
      - name: Backup readiness
        env:
          PYTHONPATH: src
        run: python -m shop_integration backup-readiness
      - name: Write Google credentials from secret
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          if [ -n "$GOOGLE_CREDENTIALS_JSON" ]; then
            printf '%s' "$GOOGLE_CREDENTIALS_JSON" > GOOGLE_CREDENTIALS_FILE.json
          fi
      - name: Read-only source sync
        env:
          PYTHONPATH: src
          DRY_RUN: "true"
          ENABLE_PURCHASE: "false"
          ENABLE_TELEGRAM: "false"
          SHOP_XOAI_NON_API_KEY: ${{ secrets.SHOP_XOAI_NON_API_KEY }}
          NASTELE_API_KEY: ${{ secrets.NASTELE_API_KEY }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          NASTELE_SPREADSHEET_ID: ${{ secrets.NASTELE_SPREADSHEET_ID }}
          GOOGLE_DOCUMENT_ID: ${{ secrets.GOOGLE_DOCUMENT_ID }}
          GOOGLE_CREDENTIALS_FILE: ./GOOGLE_CREDENTIALS_FILE.json
        run: python -m shop_integration sync-sources
