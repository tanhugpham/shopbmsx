# Web Service miễn phí. Cron Render cần gói trả phí, không dùng ở đây.
# Push lên nhánh main chỉ deploy sau khi GitHub check "ci" đạt.
services:
  - type: web
    name: shopxoainon-web
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=src python scripts/start_web.py
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHONPATH
        value: src
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: DRY_RUN
        value: "true"
      - key: ENABLE_SCHEDULED_SYNC
        value: "true"
      - key: ENABLE_SCHEDULED_MENU_LIVE
        value: "true"
      - key: SCHEDULED_SYNC_SECONDS
        value: "300"
      - key: ENABLE_PURCHASE
        value: "false"
      - key: ENABLE_TELEGRAM
        value: "false"
      - key: SHOP_XOAI_NON_BASE_URL
        value: https://shopxoainon.online/api/v1
      - key: NASTELE_BASE_URL
        value: https://nastele.online
      - key: GOOGLE_CREDENTIALS_FILE
        value: ./GOOGLE_CREDENTIALS_FILE.json
      - key: SHOP_XOAI_NON_API_KEY
        sync: false
      - key: NASTELE_API_KEY
        sync: false
      - key: GOOGLE_SPREADSHEET_ID
        sync: false
      - key: NASTELE_SPREADSHEET_ID
        sync: false
      - key: LAST_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_DOCUMENT_ID
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: SYNC_TOKEN
        sync: false
